<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 180" width="100%" height="100%" role="img" aria-labelledby="footerTitle footerDesc">
  <title id="footerTitle">Pie de página de Jose Del Carmen Díaz Díaz (jose2520)</title>
  <desc id="footerDesc">Banner inferior estilo Liquid Glass en rojo carmesí, negro obsidiana y blanco puro con firma ejecutiva, lema y estado de disponibilidad.</desc>

  <defs>
    <!-- Deep Obsidian & Velvet Crimson Background -->
    <linearGradient id="bgFooter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050609"/>
      <stop offset="50%" stop-color="#0E080B"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>

    <!-- Main Frosted Liquid Glass Dock Fill -->
    <linearGradient id="dockGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2029" stop-opacity="0.92"/>
      <stop offset="30%" stop-color="#0D0E14" stop-opacity="0.96"/>
      <stop offset="75%" stop-color="#090A0F" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#210910" stop-opacity="0.94"/>
    </linearGradient>

    <!-- Inner Capsule Glass Fill -->
    <linearGradient id="pillGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="35%" stop-color="#14151C" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#260911" stop-opacity="0.90"/>
    </linearGradient>

    <!-- Specular Outer Rim (White Top-Left -> Crimson Bottom-Right) -->
    <linearGradient id="dockRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.58"/>
      <stop offset="25%" stop-color="#ff3349" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#4A1822" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff263d" stop-opacity="0.80"/>
    </linearGradient>

    <!-- Top Curved Glass Gloss -->
    <linearGradient id="topGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Icon Squircle Gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A101D"/>
      <stop offset="55%" stop-color="#24080E"/>
      <stop offset="100%" stop-color="#140408"/>
    </linearGradient>

    <!-- Animated Crimson-White Shimmer Text -->
    <linearGradient id="redText" x1="0%" y1="0%" x2="200%" y2="0%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF858D"/>
      <stop offset="30%" stop-color="#FF1E38"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FF1635"/>
      <stop offset="100%" stop-color="#FF858D"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-300 0" to="300 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Liquid Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3349" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FF3349" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#FF3349" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FF3349" stop-opacity="0"/>
    </linearGradient>

    <!-- Diagonal Glass Reflection Sweep -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Crimson Glow -->
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1838" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#9e0018" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff1838" stop-opacity="0"/>
    </radialGradient>

    <filter id="haloGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.72"/>
    </filter>

    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8f929d" opacity="0.22"/>
    </pattern>

    <clipPath id="dockClip">
      <rect x="34" y="22" width="1532" height="136" rx="28"/>
    </clipPath>

    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: "JetBrains Mono", "Fira Code", "SFMono-Regular", Consolas, monospace; }
      .white { fill: #F8FAFC; }
      .muted { fill: #9498A6; }
      .red { fill: #FF3349; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      .sweep { animation: sweep 9s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @keyframes sweep { 0% { transform: translateX(-350px); opacity: 0; } 20% { opacity: 0.9; } 75% { opacity: 0.45; } 100% { transform: translateX(1750px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .pulse, .sweep { animation: none; } }
    </style>
  </defs>

  <!-- 1. OBSIDIAN CANVAS & AMBIENT GLOWS -->
  <rect width="1600" height="180" rx="22" fill="url(#bgFooter)"/>

  <ellipse cx="360" cy="90" rx="340" ry="110" fill="url(#glowRed)" opacity="0.55">
    <animate attributeName="cx" values="360;420;360" dur="10s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1240" cy="90" rx="340" ry="110" fill="url(#glowRed)" opacity="0.55">
    <animate attributeName="cx" values="1240;1180;1240" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Subtle Background Grid Lines -->
  <g opacity="0.18" stroke="#a72a39" stroke-width="1" fill="none">
    <path d="M 0 45 H 1600 M 0 135 H 1600"/>
    <path d="M 540 0 V 180 M 1060 0 V 180"/>
  </g>

  <!-- Animated Liquid Horizon Wave Behind Dock -->
  <path d="M 0 90 Q 400 55 800 90 T 1600 90" fill="none" stroke="url(#waveGrad)" stroke-width="2.5">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M 0 90 Q 400 55 800 90 T 1600 90;
              M 0 90 Q 400 125 800 90 T 1600 90;
              M 0 90 Q 400 55 800 90 T 1600 90"/>
  </path>

  <!-- 2. MAIN LIQUID GLASS FOOTER DOCK -->
  <rect x="31" y="19" width="1538" height="142" rx="31" fill="none" stroke="#ff263d" stroke-width="7" opacity="0.20" filter="url(#haloGlow)" class="pulse"/>
  <rect x="34" y="22" width="1532" height="136" rx="28" fill="url(#dockGlass)" stroke="url(#dockRim)" stroke-width="1.5" filter="url(#dropShadow)"/>
  <rect x="36" y="24" width="1528" height="132" rx="26" fill="none" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.16"/>
  <rect x="34" y="22" width="1532" height="136" rx="28" fill="url(#dots)" opacity="0.22"/>

  <g clip-path="url(#dockClip)">
    <!-- Top Curved Glass Specular Highlight -->
    <path d="M 34 22 H 1566 V 62 Q 800 88 34 58 Z" fill="url(#topGloss)"/>

    <!-- =================================================== -->
    <!-- LEFT ZONE: BRAND SIGNATURE & LOCATION               -->
    <!-- =================================================== -->
    <rect x="66" y="54" width="72" height="72" rx="18" fill="url(#iconGrad)" stroke="#FF344A" stroke-width="1.5"/>
    <line x1="78" y1="54.8" x2="126" y2="54.8" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.5"/>
    <text x="102" y="98" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" class="mono">&lt;/&gt;</text>

    <text x="158" y="84" class="white" font-size="24" font-weight="800" letter-spacing="-0.6">
      Jose Del Carmen <tspan fill="url(#redText)">Díaz</tspan>
    </text>
    <text x="158" y="108" fill="#D4D4D8" font-size="13.5" font-weight="600" class="mono">
      @jose2520 <tspan fill="#FF3349">·</tspan> Full-Stack, Mobile &amp; UI/UX
    </text>
    <text x="158" y="127" class="muted" font-size="12.5" font-weight="500">
      Barranquilla, Atlántico — Colombia
    </text>

    <!-- Vertical Glass Divider 1 -->
    <line x1="538" y1="42" x2="538" y2="138" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

    <!-- =================================================== -->
    <!-- CENTER ZONE: CORE PHILOSOPHY CAPSULE                -->
    <!-- =================================================== -->
    <rect x="568" y="42" width="464" height="96" rx="22" fill="#06070B" fill-opacity="0.78" stroke="url(#dockRim)" stroke-width="1.1"/>
    <line x1="610" y1="42.6" x2="990" y2="42.6" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.38"/>

    <!-- Left Speed Chevrons -->
    <g transform="translate(598, 66)">
      <path d="M 10 0 L 0 13 H 7 L 17 0 Z" fill="#FF3048">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" begin="0s" repeatCount="indefinite"/>
      </path>
      <path d="M 22 0 L 12 13 H 19 L 29 0 Z" fill="#FFFFFF">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
      </path>
      <path d="M 34 0 L 24 13 H 31 L 41 0 Z" fill="#FF3048">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
      </path>
    </g>

    <text x="800" y="78" text-anchor="middle" class="white" font-size="15.5" font-weight="800" letter-spacing="2.4">
      CÓDIGO <tspan fill="#FF3349">+</tspan> ARTE EN SINTONÍA
    </text>

    <!-- Right Speed Chevrons -->
    <g transform="translate(961, 66)">
      <path d="M 10 0 L 0 13 H 7 L 17 0 Z" fill="#FF3048">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" begin="0s" repeatCount="indefinite"/>
      </path>
      <path d="M 22 0 L 12 13 H 19 L 29 0 Z" fill="#FFFFFF">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
      </path>
      <path d="M 34 0 L 24 13 H 31 L 41 0 Z" fill="#FF3048">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Animated Laser Track Inside Center Capsule -->
    <line x1="610" y1="94" x2="990" y2="94" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="610" y="92.8" width="96" height="2.4" rx="1.2" fill="#FF3349">
      <animate attributeName="x" values="610;894;610" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#FF3349;#FFFFFF;#FF3349" dur="2.75s" repeatCount="indefinite"/>
    </rect>

    <text x="800" y="118" text-anchor="middle" fill="#D4D4D8" font-size="13" font-weight="700" letter-spacing="3.2" class="mono">
      DISEÑA <tspan fill="#FF3349">·</tspan> DESARROLLA <tspan fill="#FF3349">·</tspan> INNOVA
    </text>

    <!-- Vertical Glass Divider 2 -->
    <line x1="1062" y1="42" x2="1062" y2="138" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

    <!-- =================================================== -->
    <!-- RIGHT ZONE: TELEMETRY, AVAILABILITY & PORTFOLIO     -->
    <!-- =================================================== -->
    <!-- Animated Equalizer Bars -->
    <g transform="translate(1096, 54)">
      <rect x="0" y="8" width="5.5" height="14" rx="2" fill="#FF3048">
        <animate attributeName="y" values="10;2;10" dur="0.85s" repeatCount="indefinite"/>
        <animate attributeName="height" values="12;20;12" dur="0.85s" repeatCount="indefinite"/>
      </rect>
      <rect x="10" y="2" width="5.5" height="20" rx="2" fill="#FFFFFF">
        <animate attributeName="y" values="2;10;2" dur="1.05s" repeatCount="indefinite"/>
        <animate attributeName="height" values="20;12;20" dur="1.05s" repeatCount="indefinite"/>
      </rect>
      <rect x="20" y="0" width="5.5" height="22" rx="2" fill="#FF3048">
        <animate attributeName="y" values="7;0;7" dur="0.75s" repeatCount="indefinite"/>
        <animate attributeName="height" values="15;22;15" dur="0.75s" repeatCount="indefinite"/>
      </rect>
      <rect x="30" y="5" width="5.5" height="17" rx="2" fill="#FFFFFF">
        <animate attributeName="y" values="3;11;3" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="height" values="19;11;19" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Availability Radar Dot & Label -->
    <circle cx="1154" cy="66" r="5" fill="#FF3349" class="pulse"/>
    <circle cx="1154" cy="66" r="5" fill="none" stroke="#FF3349" stroke-width="1.2">
      <animate attributeName="r" values="5;11" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="1170" y="71" class="white" font-size="14" font-weight="700" letter-spacing="0.5">
      DISPONIBLE PARA PROYECTOS
    </text>

    <!-- Bottom Right Portfolio & Education Capsule -->
    <rect x="1096" y="90" width="438" height="40" rx="20" fill="url(#pillGlass)" stroke="url(#dockRim)" stroke-width="1.1"/>
    <circle cx="1120" cy="110" r="4.5" fill="#FFFFFF">
      <animate attributeName="fill" values="#FFFFFF;#FF3349;#FFFFFF" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <text x="1134" y="115" class="white mono" font-size="13.5" font-weight="700">jose2520.github.io</text>
    <text x="1302" y="115" fill="#FF3349" font-size="14" font-weight="800">|</text>
    <text x="1318" y="115" fill="#D4D4D8" font-size="13" font-weight="600" class="mono">SENA ADSO · RIWI</text>
    <path d="M 1510 104 V 115 M 1510 104 H 1499 M 1510 104 L 1498 116" stroke="#FF3349" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Diagonal Glass Sheen Sweep -->
    <polygon points="-200,22 -60,22 80,158 -60,158" fill="url(#sweepGrad)" class="sweep"/>
  </g>

  <!-- Animated Laser Glint Around Footer Dock -->
  <rect x="34" y="22" width="1532" height="136" rx="28" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.75" stroke-dasharray="180 3150" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="3330" to="0" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#FFFFFF;#FF3349;#FFFFFF" dur="5.5s" repeatCount="indefinite"/>
  </rect>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Jose - Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b3a">
        <animate attributeName="stop-color" values="#161b3a;#2a1550;#10304a;#161b3a" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#ff7bc6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff7bc6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="typing">
      <rect x="250" y="130" height="40" width="0">
        <animate attributeName="width" values="0;400;400;0" keyTimes="0;0.45;0.85;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="240" rx="16" fill="url(#bg)"/>

  <!-- floating particles -->
  <g fill="#bc8cff" opacity="0.5">
    <circle cx="80" cy="60" r="3"><animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="190" r="2"><animate attributeName="cy" values="190;165;190" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="40" r="2.5"><animate attributeName="cy" values="40;60;40" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="55" r="3"><animate attributeName="cy" values="55;35;55" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="170" r="2"><animate attributeName="cy" values="170;195;170" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="200" r="2.5"><animate attributeName="cy" values="200;178;200" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- code brackets -->
  <g font-family="'Courier New', monospace" font-size="90" fill="#58a6ff" opacity="0.18">
    <text x="60" y="150">&lt;</text>
    <text x="760" y="150">/&gt;</text>
  </g>

  <!-- title -->
  <text x="450" y="110" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="68" font-weight="800" fill="url(#title)" filter="url(#glow)">
    Hola, soy Jose
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- typing subtitle -->
  <g clip-path="url(#typing)">
    <text x="450" y="158" text-anchor="middle" font-family="'Courier New', monospace" font-size="24" fill="#c9d1d9">
      &gt; Desarrollador de software_
    </text>
  </g>

  <!-- animated wave -->
  <path d="M0 215 Q 112 190 225 215 T 450 215 T 675 215 T 900 215" fill="none" stroke="url(#wave)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="d" dur="5s" repeatCount="indefinite"
      values="M0 215 Q 112 190 225 215 T 450 215 T 675 215 T 900 215;
              M0 215 Q 112 240 225 215 T 450 215 T 675 215 T 900 215;
              M0 215 Q 112 190 225 215 T 450 215 T 675 215 T 900 215"/>
  </path>
</svg>

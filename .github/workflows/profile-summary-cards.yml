name: Profile Summary Cards

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: -5
          EXCLUDE: "CSS,HTML"
          THEME: "github_dark"
          AUTO_PUSH: false

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: -5
          EXCLUDE: "CSS,HTML"
          THEME: "default"
          AUTO_PUSH: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update adaptive streak-stats and cards
        run: |
          curl -s "https://streak-stats.demolab.com?user=${{ github.repository_owner }}&locale=es&hide_border=true&background=0E080B&stroke=2A2228&ring=FF3349&fire=FF3349&currStreakLabel=FF3349&currStreakNum=F5F2F0&sideNums=F5F2F0&sideLabels=F5F2F0&dates=A39FA8" -o /tmp/streak.svg
          cd scripts && npm ci && npm run build

      - name: Commit and push updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/
          git diff --cached --quiet || (git commit -m "chore: update profile summary and streak cards" && git push)
